<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 983 257" role="img" aria-labelledby="title detail"><title id="title">Active Directory Security Lab component flow</title><desc id="detail">Windows client to AD DS + DNS via DNS and Kerberos. Windows client to Member service via service ticket. Admin workstation to AD DS + DNS via delegated management. AD DS + DNS to Audit and recovery via logs and system state.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0L6 3 0 6z" fill="#10B981"/></marker></defs><rect width="983" height="257" rx="16" fill="#0B1220"/>
<g font-family="system-ui, sans-serif" fill="#F8FAFC" font-size="15"><text x="35" y="38" fill="#10B981" font-weight="700">PROPOSED COMPONENT FLOW</text>
<path d="M128 114V128H295V121" fill="none" stroke="#10B981" stroke-opacity=".78" marker-end="url(#arrow)"/><text x="211.5" y="124" text-anchor="middle" fill="#F8FAFC" font-size="14" stroke="#0B1220" stroke-width="7" paint-order="stroke">DNS and Kerberos</text>
<path d="M128 114V156H482V121" fill="none" stroke="#10B981" stroke-opacity=".78" marker-end="url(#arrow)"/><text x="305" y="152" text-anchor="middle" fill="#F8FAFC" font-size="14" stroke="#0B1220" stroke-width="7" paint-order="stroke">service ticket</text>
<path d="M669 114V184H315V121" fill="none" stroke="#10B981" stroke-opacity=".78" marker-end="url(#arrow)"/><text x="492" y="180" text-anchor="middle" fill="#F8FAFC" font-size="14" stroke="#0B1220" stroke-width="7" paint-order="stroke">delegated management</text>
<path d="M315 114V212H856V121" fill="none" stroke="#10B981" stroke-opacity=".78" marker-end="url(#arrow)"/><text x="585.5" y="208" text-anchor="middle" fill="#F8FAFC" font-size="14" stroke="#0B1220" stroke-width="7" paint-order="stroke">logs and system state</text>
<g><rect x="35" y="64" width="166" height="50" rx="9" fill="#172235" stroke="#10B981"/><text x="118" y="94" text-anchor="middle">Windows client</text></g>
